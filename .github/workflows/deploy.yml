# Deploy to Fly, after CI passes.
#
# This can only work because the collection lives in its own image (see
# Dockerfile.collection). A runner has no data/ directory and cannot build one
# without re-downloading a thousand pictures from four museum APIs, so the app
# build pulls the collection from a registry instead. Code deploys therefore
# push a few hundred kilobytes, not 166 MB.
#
# Setup, once:
#   1. Build and push the collection from a machine that has data/:
#        npm run collection:build
#        echo $CR_PAT | docker login ghcr.io -u <you> --password-stdin
#        COLLECTION_IMAGE=ghcr.io/<you>/pastperfect-collection:2026-09 npm run collection:push
#   2. Point COLLECTION_IMAGE below at that tag.
#   3. fly tokens create deploy   ->   repo Settings > Secrets > FLY_API_TOKEN
#
# Re-harvested the museums? Push a new collection tag and bump COLLECTION_IMAGE.
# Pinning the tag rather than using :latest means a deploy cannot silently pick
# up a different collection than the one that was tested.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job widens this to add `packages: read`; everything else, the
# verify job included, gets no more than checkout and the tests need.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy mid-flight

env:
  COLLECTION_IMAGE: ghcr.io/nyatasha/pastperfect-collection:2026-09

jobs:
  # Deploying something the tests have not seen is how a broken daily reaches
  # players, so this repeats CI rather than trusting a parallel run.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # to pull the collection image from GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: |
          flyctl deploy \
            --build-arg COLLECTION="$COLLECTION_IMAGE" \
            --remote-only \
            --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that returns green while the site serves 500s is worse than a
      # deploy that fails, so check the thing players actually load.
      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          BASE="https://${{ vars.FLY_APP_HOSTNAME || 'pastperfect.fly.dev' }}"
          for path in /api/health /daily /museums; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
                        --retry-all-errors --max-time 30 "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          curl -sS --max-time 30 "$BASE/api/health" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                const h=JSON.parse(d);
                if(!h.ok){console.error('::error::health reports not ok',d);process.exit(1);}
                console.log('healthy:',h.objects,'objects,',h.pairs,'questions, puzzle #'+h.puzzle);
              })"
