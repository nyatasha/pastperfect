# fly.toml app configuration file generated for pastperfect on 2026-09-04T23:40:06+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pastperfect'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PASTPERFECT_BASE_URL = 'https://pastperfect.fly.dev'

[[mounts]]
  source = 'pastperfect_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 120
    soft_limit = 60

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
